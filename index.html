<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>GwenConnect Governance</title>
  <link rel="manifest" href="manifest.json">

<link rel="icon" type="image/svg+xml" href="./logo.svg">

<link rel="apple-touch-icon" href="./logo.svg">

<meta name="theme-color" content="#3c9fc9">

  <style>
    :root {
      --navy: #102a43;
      --blue: #3c9fc9;
      --green: #62a800;
      --gold: #d9a441;
      --bg: #f4f9fc;
      --text: #1f2937;
      --muted: #6b7280;
      --card: #ffffff;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .loader {
      position: fixed;
      inset: 0;
      background: var(--blue);
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      transition: opacity .3s ease;
    }

    .loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loaderCard {
      width: min(90%, 420px);
      background: #ffffff;
      border: 1px solid #d8e8f0;
      border-radius: 26px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(16,42,67,.16);
    }
.logoImage {
  width: 120px;
  max-width: 100%;
  display: block;
  margin: 0 auto 18px;
}
    .loader h1 {
      margin: 0;
      font-size: 26px;
    }

    .loader p {
      margin: 8px 0 0;
      color: #40566b;
      font-size: 14px;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 4px solid #d8e8f0;
      border-top-color: var(--green);
      border-radius: 50%;
      margin: 22px auto 0;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    .fallback {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 10;
      background: var(--gold);
      color: #111827;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px;
      box-shadow: 0 10px 25px rgba(15,23,42,.25);
    }

    @media (max-width: 700px) {
      .fallback {
        left: 14px;
        right: 14px;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <div id="loader" class="loader">
    <div class="loaderCard">
      <img
  src="./logo.svg"
  class="logoImage"
  alt="GwenConnect Governance"
/>
      <h1>GwenConnect Governance</h1>
      <p>Loading compliance, evidence and audit dashboard...</p>
      <div class="spinner"></div>
    </div>
  </div>

  <iframe
  id="gwenFrame"
  src="https://script.google.com/macros/s/AKfycbwVpmmc5sZ7pHRHZH_Xb6fRJZbctjwgoXSjgNpSa8hIhg8PkymOxj2NyOM6W2E0QJBk/exec"
  allow="clipboard-read; clipboard-write"
></iframe>

  <a
  class="fallback"
  href="https://script.google.com/macros/s/AKfycbwVpmmc5sZ7pHRHZH_Xb6fRJZbctjwgoXSjgNpSa8hIhg8PkymOxj2NyOM6W2E0QJBk/exec"
  target="_blank"
>
  Open directly
</a>

  <script>
    const frame = document.getElementById("gwenFrame");
    const loader = document.getElementById("loader");

    frame.addEventListener("load", function () {
      setTimeout(function () {
        loader.classList.add("hidden");
      }, 500);
    });
  </script>

</body>
</html>
